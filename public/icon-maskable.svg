<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0814" />
      <stop offset="50%" stop-color="#1b0e33" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="v-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glow-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="ring-grad-m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="drop-shadow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable adaptive icon -->
  <rect width="512" height="512" fill="url(#bg-grad-m)" />

  <!-- Safe Zone Scaled Group (scale 0.78 centered at 256,256) -->
  <g transform="translate(56, 56) scale(0.78)">
    <!-- Ambient Glow -->
    <circle cx="256" cy="256" r="140" fill="url(#glow-grad-m)" opacity="0.35" />

    <!-- Story ring -->
    <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ring-grad-m)" stroke-width="4" stroke-dasharray="14 8" opacity="0.5" />

    <!-- V Glyph -->
    <g filter="url(#drop-shadow-m)">
      <path
        d="M140 144 L218 360 C230 392, 282 392, 294 360 L372 144 C378 128, 362 114, 346 120 L318 130 C306 134, 296 144, 292 156 L256 276 L220 156 C216 144, 206 134, 194 130 L166 120 C150 114, 134 128, 140 144 Z"
        fill="url(#v-grad-m)"
      />
      <path
        d="M256 276 L292 156 C296 144, 306 134, 318 130 L346 120 C362 114, 378 128, 372 144 L294 360 C282 392, 230 392, 218 360 L204 320 Z"
        fill="#ffffff"
        opacity="0.18"
      />
      <!-- Sparkle / Camera Lens Star Top-Right -->
      <path
        d="M380 110 Q380 135 405 135 Q380 135 380 160 Q380 135 355 135 Q380 135 380 110 Z"
        fill="#ec4899"
        opacity="0.9"
      />
      <circle cx="380" cy="135" r="3" fill="#ffffff" />
    </g>
  </g>
</svg>

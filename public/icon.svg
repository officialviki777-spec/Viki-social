<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508" />
      <stop offset="50%" stop-color="#08080C" />
      <stop offset="100%" stop-color="#020204" />
    </linearGradient>
    <linearGradient id="v-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F0FF" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Black Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Electric Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#ring-grad)" stroke-width="6" stroke-opacity="0.45" />

  <!-- Ambient Cyan & Electric Blue Glow Behind Logo -->
  <circle cx="256" cy="256" r="150" fill="url(#glow-grad)" filter="url(#glow)" opacity="0.4" />

  <!-- Subtle Dashed Orbit Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#ring-grad)" stroke-width="3.5" stroke-dasharray="14 8" opacity="0.5" />

  <!-- V Logo Glyph -->
  <g filter="url(#drop-shadow)">
    <!-- Primary Stylish 'V' -->
    <path
      d="M140 144 L218 360 C230 392, 282 392, 294 360 L372 144 C378 128, 362 114, 346 120 L318 130 C306 134, 296 144, 292 156 L256 276 L220 156 C216 144, 206 134, 194 130 L166 120 C150 114, 134 128, 140 144 Z"
      fill="url(#v-grad)"
    />

    <!-- Overlapping Inner Facet for Premium Dimension -->
    <path
      d="M256 276 L292 156 C296 144, 306 134, 318 130 L346 120 C362 114, 378 128, 372 144 L294 360 C282 392, 230 392, 218 360 L204 320 Z"
      fill="#ffffff"
      opacity="0.22"
    />

    <!-- Cyan Electric Diamond Star Accent -->
    <path
      d="M380 110 Q380 135 405 135 Q380 135 380 160 Q380 135 355 135 Q380 135 380 110 Z"
      fill="#00F0FF"
      opacity="0.95"
    />
    <circle cx="380" cy="135" r="3.5" fill="#ffffff" />
  </g>
</svg>
